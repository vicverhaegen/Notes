<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Glass card surface gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.90" />
    </linearGradient>

    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Drop shadow for the icon container -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- App Tile Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Left Column Glass Container -->
  <rect x="80" y="96" width="160" height="320" rx="24" fill="url(#columnGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Right Column Glass Container -->
  <rect x="272" y="96" width="160" height="320" rx="24" fill="url(#columnGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Left Column: Top Card with checkmark dot & lines -->
  <g filter="url(#cardShadow)">
    <rect x="96" y="120" width="128" height="130" rx="16" fill="url(#cardGrad)" />
    <!-- Checkmark badge (done task) -->
    <circle cx="122" cy="148" r="10" fill="#10b981" />
    <path d="M118 148 L121 151 L127 145" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Title Line -->
    <rect x="140" y="144" width="68" height="8" rx="4" fill="#94a3b8" />
    <!-- Sub lines -->
    <rect x="112" y="174" width="96" height="6" rx="3" fill="#cbd5e1" />
    <rect x="112" y="190" width="64" height="6" rx="3" fill="#e2e8f0" />
    <!-- Tiny date pill -->
    <rect x="112" y="214" width="46" height="16" rx="6" fill="#ecfdf5" />
    <rect x="122" y="220" width="26" height="4" rx="2" fill="#10b981" />
  </g>

  <!-- Left Column: Bottom Card -->
  <g filter="url(#cardShadow)">
    <rect x="96" y="270" width="128" height="96" rx="16" fill="url(#cardGrad)" />
    <!-- Dot & title lines -->
    <circle cx="122" cy="298" r="8" fill="#e2e8f0" />
    <rect x="138" y="294" width="70" height="8" rx="4" fill="#64748b" />
    <rect x="112" y="324" width="80" height="6" rx="3" fill="#cbd5e1" />
    <!-- Subtle Clock/Date badge -->
    <rect x="112" y="340" width="50" height="14" rx="5" fill="#fee2e2" />
    <circle cx="120" cy="347" r="3" fill="#ef4444" />
    <rect x="127" y="345" width="26" height="4" rx="2" fill="#ef4444" />
  </g>

  <!-- Right Column: Card -->
  <g filter="url(#cardShadow)">
    <rect x="288" y="120" width="128" height="180" rx="16" fill="url(#cardGrad)" />
    <circle cx="314" cy="148" r="8" fill="#e2e8f0" />
    <rect x="330" y="144" width="70" height="8" rx="4" fill="#334155" />
    <rect x="304" y="174" width="96" height="6" rx="3" fill="#94a3b8" />
    <rect x="304" y="190" width="84" height="6" rx="3" fill="#cbd5e1" />
    <rect x="304" y="206" width="60" height="6" rx="3" fill="#e2e8f0" />

    <!-- Accent progress pill -->
    <rect x="304" y="244" width="96" height="8" rx="4" fill="#e2e8f0" />
    <rect x="304" y="244" width="60" height="8" rx="4" fill="#3b82f6" />
  </g>
</svg>
